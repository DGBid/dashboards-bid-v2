<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Kommo + Meta | BID</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--y:#FFCC29;--g:#1D1D1C;--b:#000;--w:#fff;--c:#151515;--bd:#30302F;--m:#7f7f7b;--s:#b8b8b5}
body{min-height:100vh;background:radial-gradient(circle at 85% -10%,rgba(255,204,41,.10),transparent 28%),var(--b);color:var(--w);font-family:"Gotham","Gotham SSm","Montserrat",Arial,sans-serif}
.page{width:min(1240px,calc(100% - 60px));margin:auto;padding:44px 0 64px}
.nav{display:flex;justify-content:space-between;align-items:center;padding-bottom:34px;border-bottom:1px solid var(--bd)}
.left{display:flex;align-items:center;gap:24px}.logo{width:118px}.back{color:var(--s);text-decoration:none;font-size:11px;font-weight:600}.back:hover{color:var(--y)}
.area{color:var(--s);font-size:10px;font-weight:700;letter-spacing:1.25px;text-transform:uppercase}
.hero{display:grid;grid-template-columns:1fr auto;gap:50px;align-items:end;padding:70px 0 58px}
.ey{color:var(--y);font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:20px}
h1{font-size:clamp(44px,6vw,78px);line-height:.96;letter-spacing:-3px}.yellow{color:var(--y)}
.count{color:var(--y);font-size:58px;font-weight:700}.countlab{display:block;color:var(--m);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding-top:24px;margin-bottom:22px;border-top:1px solid var(--bd)}
.k{color:var(--y);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}.head h2{font-size:24px}.note{color:var(--m);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-height:245px;display:flex;flex-direction:column;justify-content:space-between;padding:31px;background:var(--c);border:1px solid var(--bd);border-radius:4px;color:var(--w);text-decoration:none;transition:.2s}
.card:hover{transform:translateY(-3px);background:var(--g);border-color:rgba(255,204,41,.45)}
.top{display:flex;justify-content:space-between}.tag{color:var(--y);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}.num{color:#383838;font-size:36px;font-weight:700}
.content{margin-top:32px}.content h3{font-size:25px;margin-bottom:14px}.content p{color:var(--s);font-size:13px;line-height:1.6;max-width:500px}
.action{display:flex;justify-content:flex-end;margin-top:34px}.btn{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600}.arr{width:32px;height:32px;display:grid;place-items:center;background:var(--y);color:var(--b);font-size:17px;font-weight:700}
.footer{display:flex;justify-content:space-between;margin-top:58px;padding-top:23px;border-top:1px solid var(--bd);color:var(--m);font-size:9px;font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.placeholder{padding:38px;background:#111;border:1px solid var(--bd);border-radius:4px}.placeholder h2{font-size:28px;margin-bottom:12px}.placeholder p{color:var(--s);line-height:1.6}
@media(max-width:850px){.page{width:calc(100% - 34px)}.hero{grid-template-columns:1fr}.hero>div:last-child{display:none}.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="page">
<nav class="nav"><div class="left"><img src="../../logo-bid.png" class="logo" alt="BID"><a class="back" href="./">← Volver</a></div><div class="area">Marketing · Análisis de datos</div></nav>
<header class="hero"><div><div class="ey">Línea Rovesco</div><h1>Dashboard Kommo + Meta</h1></div></header>
<main><div class="placeholder"><h2>Archivo listo para reemplazar</h2><p>Subí acá el dashboard real conservando este nombre de archivo.</p></div></main>
</div></body></html>
